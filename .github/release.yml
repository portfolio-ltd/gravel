# Categories for auto-generated release notes, by PR label
changelog:
  exclude:
    labels: ["skip-changelog"]
  categories:
    - title: Breaking changes
      labels: ["breaking"]
    - title: Features
      labels: ["enhancement"]
    - title: Fixes
      labels: ["bug"]
    - title: Documentation
      labels: ["documentation"]
    - title: Dependencies
      labels: ["dependencies"]
    - title: Other changes
      labels: ["*"]
