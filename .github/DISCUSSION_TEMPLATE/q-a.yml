labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Gravel version or commit
  - type: dropdown
    id: setup
    attributes:
      label: How are you running Gravel?
      options:
        - Docker Compose
        - Raspberry Pi / ARM
        - Local development
        - Other
