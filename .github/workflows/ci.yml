name: CI

on:
  push:
    branches: [uat, main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt ruff
      - run: ruff check .
      - run: python -m pytest tests/ -q
        env:
          RUNTIME_MODE: simulated

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  docker:
    runs-on: ubuntu-latest
    needs: [api, web]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -t gravel-api ./apps/api
          docker build -t gravel-web --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000 ./apps/web
          docker build -t gravel-engineer ./apps/runtime
