name: CI

on:
  push:
    branches: [main, uat]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv venv .venv && uv pip install --python .venv/bin/python -r requirements.txt ruff
      - run: .venv/bin/ruff check .
      - run: .venv/bin/python -m pytest -q
        env:
          RUNTIME_MODE: simulated

  runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/runtime
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv venv .venv && uv pip install --python .venv/bin/python -e ".[test]"
      - run: .venv/bin/python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  docker:
    runs-on: ubuntu-latest
    needs: [api, runtime, web]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -t gravel-api ./apps/api
          docker build -t gravel-web --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000 ./apps/web
          docker build -t gravel-engineer ./apps/runtime
