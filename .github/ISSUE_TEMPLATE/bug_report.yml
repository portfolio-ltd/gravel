name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Web UI, API, Engineer runtime, Workflows / method, Integrations, Self-hosting, Other]
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant API or runtime logs (remove secrets).
      render: shell
