[project]
name = "gravel-runtime"
version = "0.1.0"
description = "Gravel engineer runtime and the gravel CLI: run Gravel tasks with your own AI CLI login"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic-settings>=2.5",
]

[project.scripts]
gravel = "gravel_runtime.cli:main"

[project.optional-dependencies]
llm = ["anthropic>=2.3,<3", "openai>=1.50"]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gravel_runtime*"]
