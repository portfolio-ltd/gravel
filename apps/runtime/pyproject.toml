[project]
name = "gravel-runtime"
version = "0.2.0"
description = "Gravel engineer runtime: polls the Gravel API for task runs and executes them"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic-settings>=2.5",
]

[project.optional-dependencies]
llm = ["anthropic>=2.3,<3", "openai>=1.50"]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gravel_runtime*"]
